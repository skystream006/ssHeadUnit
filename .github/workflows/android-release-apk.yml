name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Android version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          build_file = Path("app/build.gradle.kts")
          text = build_file.read_text()

          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not name_match:
              raise SystemExit("versionName not found in app/build.gradle.kts")

          print(f"version_name={name_match.group(1)}")
          PY

      - name: Build release APK
        run: ./gradlew test assembleRelease

      - name: Set APK name
        id: apk_name
        run: echo "apk_name=ssHeadUnit-v${{ steps.version.outputs.version_name }}-release-unsigned" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "${{ steps.apk_name.outputs.apk_name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk_name.outputs.apk_name }}
          path: ${{ steps.apk_name.outputs.apk_name }}.apk
          if-no-files-found: error
